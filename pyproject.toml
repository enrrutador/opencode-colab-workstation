[project]
name = "opencode-cloud-workstation"
version = "5.0.0"
description = "OpenCode Cloud Workstation - Persistent OpenCode on Kaggle"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
